name: Build Experimental GKI Kernel (5.15.189-android13-8)

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - KernelSU-Next
          - KernelSU
      ksu_ref:
        description: 'KernelSU Branch or Tag'
        required: true
        default: 'next'
        type: string

jobs:
  build-gki:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Runner Disk Space (/mnt)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/gki
          sudo chown -R $USER:$USER /mnt/gki

      - name: Install Build Dependencies & Google Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 rsync bc bison flex libssl-dev libelf-dev cpio lz4 zstd unzip zip
          mkdir -p ~/.local/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo

      - name: Sync android13-5.15 & Pin Sublevel 5.15.189
        working-directory: /mnt/gki
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config --global user.name "DeltabsoluteZero"
          git config --global user.email "aszte5349@gmail.com"
          git config --global color.ui false

          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b android13-5.15
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

          cd common
          git fetch --shallow-since="2025-05-01" origin android13-5.15 || true
          COMMIT_189=$(git log --grep="5.15.189" --format="%H" | head -n 1)
          if [ -n "$COMMIT_189" ]; then
            echo "Checking out 5.15.189 commit: $COMMIT_189"
            git checkout "$COMMIT_189"
          fi

          sed -i 's/KMI_GENERATION=.*/KMI_GENERATION=8/' build.config.constants

      - name: Integrate ${{ inputs.ksu_variant }} & Configure Defconfig
        working-directory: /mnt/gki
        run: |
          if [ "${{ inputs.ksu_variant }}" = "KernelSU-Next" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.ksu_ref }}/kernel/setup.sh" | bash -s "${{ inputs.ksu_ref }}"
          else
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${{ inputs.ksu_ref }}/kernel/setup.sh" | bash -s "${{ inputs.ksu_ref }}"
          fi

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          sed -i 's/CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/g' "$DEFCONFIG"

          sed -i 's/check_defconfig//g' common/build.config.gki common/build.config.common || true
          sed -i 's/-dirty//g' common/scripts/setlocalversion || true

      - name: Compile 5.15.189-android13-8-33515457 via Kleaf
        working-directory: /mnt/gki
        env:
          BUILD_NUMBER: "33515457"
        run: |
          tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=/mnt/gki/out_dist

      - name: Package Kernel Images & AnyKernel3 Zip
        working-directory: /mnt/gki
        run: |
          mkdir -p /mnt/gki/artifacts
          cp /mnt/gki/out_dist/Image /mnt/gki/artifacts/
          [ -f /mnt/gki/out_dist/Image.lz4 ] && cp /mnt/gki/out_dist/Image.lz4 /mnt/gki/artifacts/
          [ -f /mnt/gki/out_dist/Image.gz ] && cp /mnt/gki/out_dist/Image.gz /mnt/gki/artifacts/

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /mnt/gki/AnyKernel3
          rm -rf /mnt/gki/AnyKernel3/.git /mnt/gki/AnyKernel3/modules /mnt/gki/AnyKernel3/patch /mnt/gki/AnyKernel3/ramdisk
          cp /mnt/gki/out_dist/Image /mnt/gki/AnyKernel3/Image
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' /mnt/gki/AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' /mnt/gki/AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' /mnt/gki/AnyKernel3/anykernel.sh
          (cd /mnt/gki/AnyKernel3 && zip -r9 "/mnt/gki/artifacts/PixelRoot-5.15.189-android13-8-${{ inputs.ksu_variant }}-AnyKernel3.zip" .)

      - name: Upload Experimental GKI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelRoot-5.15.189-android13-8-${{ inputs.ksu_variant }}
          path: /mnt/gki/artifacts/*
